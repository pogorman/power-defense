<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/power-defense/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Defense</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
      // Restore the player's choice before first paint unless this link overrides it.
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        if (param === "light" || param === "dark") return;
        let saved = null;
        try {
          saved = window.localStorage.getItem("ogtd-ui-theme");
        } catch (error) {
          console.warn("Unable to read the interface appearance preference.", error);
        }
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <link rel="stylesheet" crossorigin href="/power-defense/assets/index-DqI_Yz1f.css">

  </body>
</html>
